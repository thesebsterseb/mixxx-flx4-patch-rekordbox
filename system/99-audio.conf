# Realtime scheduling and memory locking for audio work.
# Installed to /etc/security/limits.d/99-audio.conf
# Applied by PAM at login, so it covers SSH sessions and the console login
# that starts i3. It does NOT cover systemd services -- those need
# LimitRTPRIO= / LimitMEMLOCK= in the unit file instead.

@audio   -  rtprio      95
@audio   -  memlock     unlimited
@audio   -  nice       -19
